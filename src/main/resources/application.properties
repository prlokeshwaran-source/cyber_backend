spring.application.name=cyber

# Local development database. Use a managed PostgreSQL database in production.
spring.datasource.url=jdbc:h2:mem:cyberdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Never expose SQL details or secrets in API errors.
server.error.include-message=never
server.error.include-stacktrace=never
