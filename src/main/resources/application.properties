spring.application.name=cyber
server.port=${PORT:8080}

# Configure MONGODB_URI in the environment; keep database credentials out of source control.
spring.mongodb.uri=${MONGODB_URI}

# Reserved signing secret for JWT support; supply a random secret in deployment settings.
app.jwt.secret=${JWT_SECRET}

# Comma-separated browser origins, with scheme and optional port; no trailing slash.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://cyber-frontend-nu.vercel.app}

# Never expose SQL details or secrets in API errors.
server.error.include-message=never
server.error.include-stacktrace=never
